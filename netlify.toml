[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Desactiva Pretty URLs (301 /ruta → /ruta/ o .html → extensionless)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Variables que DEBEN estar en Netlify UI también:
# VITE_SITE_URL=https://conferenciasipaat.gob.ar
# VITE_GOOGLE_SCRIPT_URL=...
# En Netlify UI: desactivar "Prerendering" si está activo (causa Error de redirección en GSC).

# Espejo de public/_redirects con force=true (prioridad sobre archivos/carpetas)
[[redirects]]
  from = "/noticias"
  to = "/noticias.html"
  status = 200
  force = true

[[redirects]]
  from = "/noticias/"
  to = "/noticias.html"
  status = 200
  force = true

[[redirects]]
  from = "/noticias/1"
  to = "/noticias/cumbre-regional-en-tucuman-energia-cultivada-el-bioetanol-en-el-desarrollo-del-noa"
  status = 301

[[redirects]]
  from = "/noticias/2"
  to = "/noticias/la-cumbre-de-biocombustible-reafirmo-el-rol-del-bioetanol-para-el-desarrollo-economico-y-ambiental-del-noa"
  status = 301

[[redirects]]
  from = "/noticias/3"
  to = "/noticias/el-oficialismo-presento-un-nuevo-proyecto-de-ley-de-biocombustibles-mas-cortes-precios-por-paridad-y-libre-negociacion-entre-privados"
  status = 301

[[redirects]]
  from = "/noticias/4"
  to = "/noticias/el-gobierno-permitira-agregarles-mas-bioetanol-a-las-naftas"
  status = 301

[[redirects]]
  from = "/noticias/5"
  to = "/noticias/el-reciente-incremento-ratifica-la-necesidad-de-avanzar-hacia-un-mayor-corte-de-bioetanol"
  status = 301

[[redirects]]
  from = "/noticias/:slug"
  to = "/noticias/:slug.html"
  status = 200
  force = true

[[redirects]]
  from = "/noticias/:slug/"
  to = "/noticias/:slug.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/noticias"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/noticias/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
